services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DEV_LOGIN_ENABLED: "false"
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "1"
    depends_on: [redis]
  worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/api/apps/api/src/worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      DEV_LOGIN_ENABLED: "false"
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist/web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
volumes:
  redis_data:
  caddy_data:
  caddy_config:
